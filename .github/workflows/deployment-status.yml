name: Deployment Status

on:
  push:
    branches:
      - main

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue-number: ${{ steps.create-issue.outputs.issue-number }}
      previous-sha: ${{ steps.get-info.outputs.previous-sha }}
      current-sha: ${{ steps.get-info.outputs.current-sha }}
      package-version: ${{ steps.get-info.outputs.package-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Get commit and version info
        id: get-info
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          PREVIOUS_SHA=$(git rev-parse HEAD^1 2>/dev/null || echo "initial-commit")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          echo "current-sha=$CURRENT_SHA" >> $GITHUB_OUTPUT
          echo "previous-sha=$PREVIOUS_SHA" >> $GITHUB_OUTPUT
          echo "package-version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Create deployment tracking issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const currentSha = '${{ steps.get-info.outputs.current-sha }}';
            const shortSha = currentSha.substring(0, 7);
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${shortSha}`,
              body: `Deployment initiated for commit ${currentSha}`,
              labels: ['deployment', 'in-progress']
            });
            
            core.setOutput('issue-number', issue.data.number);
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              body: 'Pre-deployment checks completed'
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    outputs:
      artifact-checksum: ${{ steps.checksum.outputs.checksum }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create rollback directory
        run: mkdir -p rollback-artifacts

      - name: Create rollback script
        run: |
          cat > rollback-artifacts/rollback.sh << 'EOF'
          #!/bin/bash
          set -e
          
          # Rollback script for deployment
          PREVIOUS_COMMIT="${{ needs.pre-deployment.outputs.previous-sha }}"
          CURRENT_COMMIT="${{ needs.pre-deployment.outputs.current-sha }}"
          
          echo "Starting rollback from $CURRENT_COMMIT to $PREVIOUS_COMMIT"
          
          if [ "$PREVIOUS_COMMIT" = "initial-commit" ]; then
            echo "Error: Cannot rollback from initial commit"
            exit 1
          fi
          
          # Verify previous commit exists
          if ! git cat-file -e "$PREVIOUS_COMMIT^{commit}" 2>/dev/null; then
            echo "Error: Previous commit $PREVIOUS_COMMIT not found"
            exit 1
          fi
          
          # Checkout previous version
          git checkout "$PREVIOUS_COMMIT"
          
          # Reinstall dependencies
          npm ci
          
          echo "Rollback completed successfully to $PREVIOUS_COMMIT"
          EOF
          
          chmod +x rollback-artifacts/rollback.sh

      - name: Backup configuration files
        run: |
          cp package.json rollback-artifacts/
          cp package-lock.json rollback-artifacts/ 2>/dev/null || echo "No package-lock.json found"
          
          # Create environment template backup
          cat > rollback-artifacts/.env.template.backup << 'EOF'
          # Environment configuration backup
          NODE_ENV=production
          PORT=3000
          # Add other environment variables as needed
          EOF

      - name: Create dependency verification script
        run: |
          cat > rollback-artifacts/verify-deps.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "Verifying dependency compatibility..."
          
          # Check Node version
          NODE_VERSION=$(node -v)
          echo "Node version: $NODE_VERSION"
          
          # Verify package.json exists
          if [ ! -f "package.json" ]; then
            echo "Error: package.json not found"
            exit 1
          fi
          
          # Check for critical dependencies
          echo "Checking critical dependencies..."
          npm list --depth=0 || true
          
          echo "Dependency verification completed"
          EOF
          
          chmod +x rollback-artifacts/verify-deps.sh

      - name: Create rollback documentation
        run: |
          cat > rollback-artifacts/ROLLBACK.md << 'EOF'
          # Rollback Documentation
          
          ## Overview
          This package contains all necessary files to rollback to the previous deployment.
          
          ## Contents
          - rollback.sh - Executable rollback script
          - package.json - Package configuration backup
          - package-lock.json - Dependency lock file backup
          - .env.template.backup - Environment configuration template
          - verify-deps.sh - Dependency verification script
          
          ## Step-by-Step Rollback Instructions
          
          1. **Stop the current application**
             ```bash
             pm2 stop app || killall node
             ```
          
          2. **Execute the rollback script**
             ```bash
             ./rollback.sh
             ```
          
          3. **Verify dependencies**
             ```bash
             ./verify-deps.sh
             ```
          
          4. **Restore environment configuration**
             - Compare .env.template.backup with current .env
             - Update as necessary
          
          5. **Restart the application**
             ```bash
             npm start
             ```
          
          6. **Verify rollback success**
             - Check application health endpoint
             - Verify version matches previous deployment
             - Monitor logs for errors
          
          ## Emergency Contacts
          - DevOps Team: devops@example.com
          - On-call Engineer: Check PagerDuty
          EOF

      - name: Create rollback package
        run: |
          cd rollback-artifacts
          tar -czf ../rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.tar.gz .
          cd ..

      - name: Generate checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.tar.gz | cut -d' ' -f1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "$CHECKSUM" > rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.sha256

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ needs.pre-deployment.outputs.current-sha }}
          path: |
            rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.tar.gz
            rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.sha256
            rollback-artifacts/
          retention-days: 30

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ needs.pre-deployment.outputs.issue-number }};
            const previousSha = '${{ needs.pre-deployment.outputs.previous-sha }}';
            const currentSha = '${{ needs.pre-deployment.outputs.current-sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package-version }}';
            const checksum = '${{ steps.checksum.outputs.checksum }}';
            
            const comment = `## 🔄 Rollback Plan Ready
            
            **Previous Commit:** ${previousSha}
            **Current Commit:** ${currentSha}
            **Package Version:** ${packageVersion}
            **Artifact:** rollback-package-${currentSha}
            
            ### Completed Components
            ✅ Rollback script created with error handling
            ✅ Configuration backup (package.json, package-lock.json)
            ✅ Environment templates backed up
            ✅ Dependency verification script created
            ✅ Detailed documentation generated
            ✅ Compressed package with checksums
            
            ### Quick Rollback Command
            \`\`\`bash
            # Download and extract rollback package
            gh run download --name rollback-package-${currentSha}
            tar -xzf rollback-package-${currentSha}.tar.gz
            cd rollback-artifacts
            ./rollback.sh
            \`\`\`
            
            **Rollback script created:** true
            **Configuration backup:** true
            **SHA256:** ${checksum}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: [pre-deployment, rollback-preparation]
    steps:
      - name: Update deployment issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ needs.pre-deployment.outputs.issue-number }};
            const currentSha = '${{ needs.pre-deployment.outputs.current-sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package-version }}';
            const checksum = '${{ needs.rollback-preparation.outputs.artifact-checksum }}';
            
            // Remove in-progress label and add completed
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'in-progress'
            });
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });
            
            // Post final comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## ✅ Deployment Completed Successfully
              
              **Commit:** ${currentSha}
              **Version:** ${packageVersion}
              
              ### Rollback Artifact Details
              - **Artifact Name:** rollback-package-${currentSha}
              - **SHA256 Checksum:** ${checksum}
              - **Retention:** 30 days
              - **Location:** GitHub Actions Artifacts
              
              The deployment has been completed and all rollback preparations are in place.`
            });
            
            // Close the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });